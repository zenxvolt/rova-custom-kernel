name: Build KernelSU-Next + Droidspaces for Rova

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'Kernel branch to build'
        required: true
        default: '13.0'
      ksu_branch:
        description: 'KernelSU-Next branch'
        required: true
        default: 'legacy'
        type: choice
        options:
          - legacy
          - stable
          - next
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: false
        default: ''

env:
  KERNEL_REPO: https://github.com/crdroidandroid/android_kernel_xiaomi_rova
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch }}
  KSU_BRANCH: ${{ github.event.inputs.ksu_branch }}
  DEFCONFIG: rova_defconfig
  ARCH: arm64
  OUT_DIR: ${{ github.workspace }}/out
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3
  TZ: Asia/Jakarta

jobs:
  build-kernel:
    name: Build Kernel for Rova
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Setup Build Environment
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends             bc bison build-essential ccache curl flex git             libncurses5-dev libssl-dev lzop python3 zip             ca-certificates gnupg
          mkdir -p ${{ env.OUT_DIR }}
          echo "Setup complete in $(($(date +%s) - $(date +%s --date='1 minute ago')))s"

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} ${{ env.KERNEL_REPO }} kernel
          cd kernel
          echo "Latest commit: $(git log --oneline -1)"

      - name: Setup Proton Clang Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git proton-clang
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 aarch64-gcc
          git clone --depth=1 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9 arm-gcc

      - name: Integrate KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s ${{ env.KSU_BRANCH }}

      - name: Apply Droidspaces Kernel Patches
        run: |
          cd kernel
          curl -fsSL -o /tmp/ds_01.patch             "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/01.fix_kernel_panic_in_xt_qtaguid.patch"
          curl -fsSL -o /tmp/ds_02.patch             "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          patch -p1 --forward < /tmp/ds_01.patch || echo "Patch 1 skipped/already applied"
          patch -p1 --forward < /tmp/ds_02.patch || echo "Patch 2 skipped/already applied"

      - name: Configure Kernel
        run: |
          cd kernel
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} ${{ env.DEFCONFIG }}

          cat << 'EOF' > /tmp/droidspaces.config
          # KernelSU-Next
          CONFIG_KSU=y
          CONFIG_KSU_KPROBE_HOOKS=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          # Droidspaces
          CONFIG_PID_NS=y
          CONFIG_UTS_NS=y
          CONFIG_IPC_NS=y
          CONFIG_USER_NS=y
          CONFIG_NET_NS=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CGROUP_PIDS=y
          CONFIG_CGROUP_SCHED=y
          CONFIG_FAIR_GROUP_SCHED=y
          CONFIG_CGROUP_NET_PRIO=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_VETH=y
          CONFIG_BRIDGE_NETFILTER=y
          CONFIG_NETFILTER_ADVANCED=y
          CONFIG_NF_CONNTRACK=y
          CONFIG_IP_NF_IPTABLES=y
          CONFIG_IP_NF_FILTER=y
          CONFIG_NF_NAT=y
          CONFIG_NF_TABLES=y
          CONFIG_IP_NF_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
          CONFIG_NETFILTER_XT_TARGET_TCPMSS=y
          CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
          CONFIG_NF_CONNTRACK_NETLINK=y
          CONFIG_NF_NAT_REDIRECT=y
          CONFIG_IP_ADVANCED_ROUTER=y
          CONFIG_IP_MULTIPLE_TABLES=y
          CONFIG_NF_CONNTRACK_IPV4=y
          CONFIG_NF_NAT_IPV4=y
          CONFIG_IP_NF_NAT=y
          CONFIG_SECCOMP_FILTER=y
          CONFIG_ANDROID_PARANOID_NETWORK=n
          CONFIG_SYSVIPC=y
          CONFIG_POSIX_MQUEUE=y
          CONFIG_FW_LOADER=y
          CONFIG_FW_LOADER_USER_HELPER=y
          CONFIG_FW_LOADER_COMPRESS=y
          EOF

          ./scripts/kconfig/merge_config.sh -m ${{ env.OUT_DIR }}/.config /tmp/droidspaces.config
          make O=${{ env.OUT_DIR }} ARCH=${{ env.ARCH }} olddefconfig

          echo "=== Key Config Verification ==="
          for cfg in CONFIG_KSU CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS CONFIG_USER_NS CONFIG_NET_NS CONFIG_CGROUPS CONFIG_CGROUP_DEVICE CONFIG_DEVTMPFS CONFIG_VETH CONFIG_ANDROID_PARANOID_NETWORK; do
            grep -E "^${cfg}=[yn]|^# ${cfg} is not set" ${{ env.OUT_DIR }}/.config || echo "${cfg}=NOT_FOUND"
          done

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="${{ github.workspace }}/toolchain/proton-clang/bin:${{ github.workspace }}/toolchain/aarch64-gcc/bin:${{ github.workspace }}/toolchain/arm-gcc/bin:${PATH}"

          echo "Clang: $(clang --version | head -1)"
          echo "GCC: $(aarch64-linux-android-gcc --version | head -1)"

          make -j$(nproc --all) O=${{ env.OUT_DIR }}             ARCH=${{ env.ARCH }}             CC=clang             AR=llvm-ar             NM=llvm-nm             OBJCOPY=llvm-objcopy             OBJDUMP=llvm-objdump             STRIP=llvm-strip             CROSS_COMPILE=aarch64-linux-android-             CROSS_COMPILE_ARM32=arm-linux-androideabi-             CLANG_TRIPLE=aarch64-linux-gnu-             KCFLAGS="-Wno-error"             2>&1 | tee ${{ env.OUT_DIR }}/build.log

      - name: Check Build Output
        run: |
          IMAGE="${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb"
          if [ ! -f "$IMAGE" ]; then
            echo "::error::Kernel image not found!"
            exit 1
          fi
          echo "Kernel size: $(ls -lh $IMAGE | awk '{print $5}')"
          echo "KERNEL_IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 ${{ env.ANYKERNEL_REPO }} anykernel
          cd anykernel

          cat << 'EOF' > anykernel.sh
          # AnyKernel3 for Rova (Redmi 4A/5A)
          properties() {           kernel.string=KernelSU-Next + Droidspaces for Rova;           do.devicecheck=1;           do.modules=0;           do.systemless=1;           do.cleanup=1;           do.cleanuponabort=0;           device.name1=rova;           device.name2=rolex;           device.name3=riva;           device.name4=Mi439;           supported.versions=11 - 14;           supported.patchlevels=;           ;           }
          block=/dev/block/bootdevice/by-name/boot;
          is_slot_device=0;
          ramdisk_compression=auto;
          patch_vbmeta_flag=auto;
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          EOF

          cp ${{ env.KERNEL_IMAGE }} .
          zip -r9 ${{ github.workspace }}/KernelSU-Next-Droidspaces-Rova.zip * -x .git README.md *placeholder
          echo "ZIP_PATH=${{ github.workspace }}/KernelSU-Next-Droidspaces-Rova.zip" >> $GITHUB_ENV

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-rova-ksu-droidspaces
          path: |
            ${{ env.OUT_DIR }}/arch/${{ env.ARCH }}/boot/Image.gz-dtb
            ${{ env.ZIP_PATH }}
            ${{ env.OUT_DIR }}/.config

      - name: Create Release
        if: github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: KernelSU-Next + Droidspaces for Rova ${{ github.event.inputs.release_tag }}
          body: |
            ## KernelSU-Next + Droidspaces for Redmi 4A/5A (Rova)
            - Device: rova / rolex / riva / Mi439
            - Kernel: 4.9 (crDroid 13 base)
            - KSU-Next Branch: `${{ env.KSU_BRANCH }}`
            - Droidspaces: Full namespace & cgroup support
          files: ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
