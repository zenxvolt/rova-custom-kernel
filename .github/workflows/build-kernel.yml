name: Build rova Custom Kernel (Root + Droidspaces)

# This workflow does NOT contain the kernel source itself. It lives in a small
# "recipe" repo (this repo) and clones crdroidandroid/android_kernel_xiaomi_rova
# fresh on every run, then layers root support + Droidspaces support on top.
#
# Target device : Xiaomi Redmi 4A (rolex) / Redmi 5A (riva) - kernel codename "rova"
# Target kernel  : Linux 4.9.337, non-GKI, arch/arm64/configs/rova_defconfig
# Verified against branch "13.0" (crDroid 13 / Android 13) as of Aug 2026.

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch of crdroidandroid/android_kernel_xiaomi_rova to build"
        required: true
        default: "13.0"
      kernelsu_variant:
        description: "Root solution to integrate"
        required: true
        type: choice
        default: sukisu-ultra
        options:
          - none
          - kernelsu-next
          - sukisu-ultra
          - resukisu
      enable_kpm:
        description: "Enable KPM (SukiSU-Ultra / ReSukiSU only, ignored otherwise)"
        required: true
        type: boolean
        default: true
      enable_susfs:
        description: "EXPERIMENTAL: try to integrate SUSFS (root hiding). May fail silently and build without it - check the log."
        required: true
        type: boolean
        default: false
      enable_droidspaces:
        description: "Enable Droidspaces (Linux container) kernel support"
        required: true
        type: boolean
        default: true
      enable_lto:
        description: "Enable Clang ThinLTO (slower build, smaller/faster kernel)"
        required: true
        type: boolean
        default: false
      make_release:
        description: "Publish a GitHub Release with the flashable zip"
        required: true
        type: boolean
        default: true

env:
  KERNEL_REPO: https://github.com/crdroidandroid/android_kernel_xiaomi_rova
  TOOLCHAIN_REPO: https://github.com/kdrag0n/proton-clang
  DEFCONFIG: rova_defconfig
  ARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout build recipe (this repo)
        uses: actions/checkout@v4
        with:
          path: build-configs

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/.ghcup || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev build-essential \
            kmod cpio zip unzip rsync git curl python3 device-tree-compiler

      - name: Configure git identity
        run: |
          git config --global user.email "ci@localhost"
          git config --global user.name "GitHub Actions"

      - name: Clone kernel source (${{ github.event.inputs.kernel_branch }})
        run: |
          git clone --depth=1 --branch "${{ github.event.inputs.kernel_branch }}" "$KERNEL_REPO" kernel

      - name: Cache Clang toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain
          key: proton-clang-toolchain-v1

      - name: Clone Clang toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: git clone --depth=1 "$TOOLCHAIN_REPO" toolchain

      # ---------------------------------------------------------------
      # Root solution integration
      # ---------------------------------------------------------------
      - name: Integrate root solution
        if: github.event.inputs.kernelsu_variant != 'none'
        working-directory: kernel
        run: |
          set -e
          case "${{ github.event.inputs.kernelsu_variant }}" in
            kernelsu-next)
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy
              ;;
            sukisu-ultra)
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
              ;;
            resukisu)
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
              ;;
          esac
          cp ../build-configs/kernelsu/kprobes.config .

      - name: Add KPM support
        if: github.event.inputs.kernelsu_variant == 'sukisu-ultra' || github.event.inputs.kernelsu_variant == 'resukisu'
        working-directory: kernel
        run: |
          if [ "${{ github.event.inputs.enable_kpm }}" = "true" ]; then
            cp ../build-configs/kernelsu/kpm.config .
          fi

      # ---------------------------------------------------------------
      # SUSFS (experimental, best-effort - see workflow header comment)
      # ---------------------------------------------------------------
      - name: "(Experimental) Integrate SUSFS"
        if: github.event.inputs.enable_susfs == 'true' && github.event.inputs.kernelsu_variant != 'none'
        working-directory: kernel
        continue-on-error: true
        run: |
          echo "::warning::SUSFS on this exact downstream 4.9 tree is experimental. If patches fail to apply, the step is skipped and the build continues WITHOUT susfs."
          set -e
          git clone --depth=1 -b kernel-4.9 https://gitlab.com/simonpunk/susfs4ksu.git susfs4ksu

          KERNEL_PATCH=$(find susfs4ksu/kernel_patches -maxdepth 1 -iname "*susfs*kernel-4.9*.patch" | head -n1)
          KSU_PATCH=$(find susfs4ksu/kernel_patches/KernelSU -maxdepth 1 -iname "*enable_susfs*ksu*.patch" 2>/dev/null | head -n1)

          if [ -z "$KERNEL_PATCH" ]; then
            echo "::warning::Could not locate a susfs kernel-4.9 patch file, aborting susfs integration."
            exit 1
          fi

          cp susfs4ksu/kernel_patches/fs/susfs.c fs/ 2>/dev/null || true
          cp susfs4ksu/kernel_patches/fs/sus_su.c fs/ 2>/dev/null || true
          cp susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/ 2>/dev/null || true
          cp susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/ 2>/dev/null || true

          patch -p1 < "$KERNEL_PATCH"
          [ -n "$KSU_PATCH" ] && (cd KernelSU && patch -p1 < "../$KSU_PATCH")

          if [ -f ../build-configs/kernelsu/susfs.config ]; then
            cp ../build-configs/kernelsu/susfs.config .
          fi
          echo "SUSFS_APPLIED=true" >> "$GITHUB_ENV"

      - name: Report SUSFS status
        run: |
          if [ "${{ github.event.inputs.enable_susfs }}" = "true" ]; then
            if [ "$SUSFS_APPLIED" = "true" ]; then
              echo "SUSFS: applied successfully" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "SUSFS: requested but FAILED to apply, build continued without it - check the previous step's log" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      # ---------------------------------------------------------------
      # Droidspaces
      # ---------------------------------------------------------------
      - name: Integrate Droidspaces support
        if: github.event.inputs.enable_droidspaces == 'true'
        working-directory: kernel
        run: |
          set -e
          cp ../build-configs/droidspaces/droidspaces_nongki.config .
          patch -p1 < ../build-configs/droidspaces/0001-droidspaces-cgroup-fix.patch
          # Note: the upstream qtaguid kABI patch from Droidspaces-OSS is deliberately
          # NOT applied - net/netfilter/xt_qtaguid.c does not exist in this tree, so
          # it isn't needed here.

      # ---------------------------------------------------------------
      # LTO (optional)
      # ---------------------------------------------------------------
      - name: Enable ThinLTO
        if: github.event.inputs.enable_lto == 'true'
        working-directory: kernel
        run: echo "CONFIG_LTO_CLANG=y" > lto.config

      # ---------------------------------------------------------------
      # Compose final defconfig (same technique the upstream Mi8937 AIO
      # Kernel build-release.sh uses: concatenate defconfig + fragments,
      # then let olddefconfig resolve dependencies/defaults)
      # ---------------------------------------------------------------
      - name: Compose defconfig
        working-directory: kernel
        run: |
          mkdir -p out
          FRAGMENTS="arch/arm64/configs/${DEFCONFIG}"
          for f in kprobes.config kpm.config susfs.config droidspaces_nongki.config lto.config; do
            [ -f "$f" ] && FRAGMENTS="$FRAGMENTS $f"
          done
          echo "Fragments used: $FRAGMENTS"
          cat $FRAGMENTS > out/.config

      - name: Resolve defconfig
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          make O=out ARCH=arm64 LLVM=1 olddefconfig

      # Kconfig dependency resolution can silently DROP an option we asked
      # for (e.g. CONFIG_KSU needs KPROBES + EXT4_FS; CONFIG_PID_NS/NET_NS/etc
      # for Droidspaces have their own dependency chains). Catching that here
      # takes ~5 seconds instead of discovering it after a 20-minute build
      # and a flash attempt.
      - name: Verify critical config options landed
        working-directory: kernel
        run: |
          FAIL=0
          check() {
            if ! grep -qx "$1=y" out/.config; then
              echo "::error::$1 is NOT enabled in the resolved .config (dependency likely unmet)"
              FAIL=1
            fi
          }
          if [ "${{ github.event.inputs.kernelsu_variant }}" != 'none' ]; then
            check CONFIG_KSU
            check CONFIG_KPROBES
          fi
          if [ "${{ github.event.inputs.enable_kpm }}" = "true" ] && { [ "${{ github.event.inputs.kernelsu_variant }}" = "sukisu-ultra" ] || [ "${{ github.event.inputs.kernelsu_variant }}" = "resukisu" ]; }; then
            check CONFIG_KPM
          fi
          if [ "${{ github.event.inputs.enable_droidspaces }}" = "true" ]; then
            for c in CONFIG_NAMESPACES CONFIG_PID_NS CONFIG_UTS_NS CONFIG_IPC_NS CONFIG_NET_NS CONFIG_CGROUPS CONFIG_CGROUP_DEVICE CONFIG_DEVTMPFS CONFIG_SYSVIPC; do
              check "$c"
            done
          fi
          if [ "$FAIL" = "1" ]; then
            echo "::error::One or more requested features will NOT be present in this build. Aborting before spending time compiling - check the fragment files and the Kconfig dependency chain (see error(s) above)."
            exit 1
          fi
          echo "All requested critical config options verified present." >> "$GITHUB_STEP_SUMMARY"

      - name: Compile kernel
        working-directory: kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/toolchain/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make O=out ARCH=arm64 LLVM=1 -j"$(nproc)"

          if [ ! -f out/arch/arm64/boot/Image.gz-dtb ]; then
            echo "::error::Image.gz-dtb was not produced, build failed."
            exit 1
          fi

      # ---------------------------------------------------------------
      # Package as flashable AnyKernel3 zip
      # ---------------------------------------------------------------
      - name: Package AnyKernel3 zip
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3out
          rm -f ak3out/anykernel.sh
          cp build-configs/ak3/anykernel.sh ak3out/anykernel.sh
          rm -rf ak3out/.git ak3out/ramdisk ak3out/patch ak3out/*.dtb ak3out/README.md
          cp kernel/out/arch/arm64/boot/Image.gz-dtb ak3out/

          NAME="rova-$(date +%Y%m%d)-${{ github.event.inputs.kernelsu_variant }}"
          if [ "$SUSFS_APPLIED" = "true" ]; then NAME="${NAME}-susfs"; fi
          if [ "${{ github.event.inputs.enable_droidspaces }}" = "true" ]; then NAME="${NAME}-droidspaces"; fi
          echo "ARTIFACT_NAME=$NAME" >> "$GITHUB_ENV"

          cp kernel/out/.config "${NAME}-kernel-config.txt"
          cd ak3out && zip -r9 "../${NAME}.zip" * -x .git

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            ${{ env.ARTIFACT_NAME }}.zip
            ${{ env.ARTIFACT_NAME }}-kernel-config.txt

      - name: Create GitHub Release
        if: github.event.inputs.make_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.ARTIFACT_NAME }}
          files: |
            ${{ env.ARTIFACT_NAME }}.zip
            ${{ env.ARTIFACT_NAME }}-kernel-config.txt
          body: |
            Automated build.
            - Kernel branch: ${{ github.event.inputs.kernel_branch }}
            - Root solution: ${{ github.event.inputs.kernelsu_variant }}
            - SUSFS: ${{ env.SUSFS_APPLIED == 'true' && 'yes' || (github.event.inputs.enable_susfs == 'true' && 'requested but failed to apply' || 'no') }}
            - Droidspaces: ${{ github.event.inputs.enable_droidspaces }}
            - LTO: ${{ github.event.inputs.enable_lto }}

            Flash the .zip via TWRP/OrangeFox or `fastboot boot`-based tools on
            Redmi 4A (rolex) / Redmi 5A (riva). Read the recipe repo's README
            before flashing - especially the manual verification steps for
            kprobe hooks.
